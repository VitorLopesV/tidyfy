name: CI

# Roda os testes (inclusive os de tela, que usam JavaFX) a cada push e pull request para a master.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    # Somente Windows: o Tidyfy depende do Agendador de Tarefas e da lixeira do Windows.
    # Os runners Windows têm sessão de área de trabalho, então os testes de tela rodam sem ajuste.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Baixa o código
        uses: actions/checkout@v4

      - name: Instala o JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compila e roda os testes
        run: mvn -B clean test

      - name: Publica o relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-de-testes
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Publica o relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-de-cobertura
          path: target/site/jacoco/
          if-no-files-found: warn
